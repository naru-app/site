<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Naru 초대장</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Naru">
  <meta property="og:title" content="Naru 초대장 💌">
  <meta property="og:description" content="서로의 시간과 오늘 일정을 홈 화면에서 같이 봐요.">
  <meta property="og:image" content="https://naru-app.store/assets/og/ko.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../assets/naru-icon.png">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf6ee; color: #262230;
           font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; text-align: center; }
    a { color: #6c5a9c; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <p>App Store로 이동하고 있어요…</p>
    <p><a id="store" href="https://apps.apple.com/app/apple-store/id6801597847?pt=129308916&amp;ct=invite&amp;mt=8">App Store에서 Naru 받기</a></p>
  </main>
  <script>
    // 초대 문구의 링크가 여기로 온다(앱의 InviteShareMessage). 연 순간만 세고 바로 App Store로 넘긴다 —
    // 초대를 보냈는데 상대가 안 온 사람이 많은데, 상대가 링크를 열기라도 했는지 볼 방법이 없었다.
    // 보내는 건 초대 코드 하나뿐이고, 결과를 기다리지 않는다(sendBeacon은 페이지를 떠나도 전송된다).
    (function () {
      var code = (new URLSearchParams(location.search).get("c") || "").trim();
      if (/^[0-9]{6}$/.test(code) && navigator.sendBeacon) {
        try {
          navigator.sendBeacon("https://ebbuloiyjemmyhxazmxh.supabase.co/functions/v1/invite-link-click",
                               new Blob([code], { type: "text/plain" }));
        } catch (e) {}
      }
      location.replace(document.getElementById("store").href);
    })();
  </script>
</body>
</html>
